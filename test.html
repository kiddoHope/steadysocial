<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini GTA - Three.js</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #instructions {
            position: absolute;
            top: 10px; left: 10px;
            background: rgba(0,0,0,0.5);
            color: white; padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="instructions">
        <b>WASD</b> to Drive | <b>Space</b> to Brake
    </div>

    <!-- Load Three.js from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Sky blue
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 1);
        sunLight.position.set(10, 20, 10);
        scene.add(sunLight);

        // --- WORLD OBJECTS ---
        // Ground (The City Floor)
        const floorGeometry = new THREE.PlaneGeometry(500, 500);
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Simple Buildings (Randomly placed)
        for (let i = 0; i < 50; i++) {
            const h = Math.random() * 10 + 2;
            const buildingGeo = new THREE.BoxGeometry(4, h, 4);
            const buildingMat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
            const building = new THREE.Mesh(buildingGeo, buildingMat);
            building.position.set(Math.random() * 100 - 50, h/2, Math.random() * 100 - 50);
            scene.add(building);
        }

        // --- THE CAR ---
        const carGroup = new THREE.Group();
        
        // Car Body
        const bodyGeo = new THREE.BoxGeometry(2, 1, 4);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.6;
        carGroup.add(body);

        // Car Cabin (Glass)
        const cabinGeo = new THREE.BoxGeometry(1.5, 0.8, 1.5);
        const cabinMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const cabin = new THREE.Mesh(cabinGeo, cabinMat);
        cabin.position.set(0, 1.4, -0.2);
        carGroup.add(cabin);

        scene.add(carGroup);

        // --- PHYSICS VARIABLES ---
        let velocity = 0;
        let rotation = 0;
        const keys = {};
        const maxSpeed = 0.5;
        const acceleration = 0.01;
        const friction = 0.98;

        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        // --- GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // Driving Logic
            if (keys['w']) velocity += acceleration;
            if (keys['s']) velocity -= acceleration;
            if (keys[' ']) velocity *= 0.9; // Brake

            // Apply Friction
            velocity *= friction;

            // Steering
            if (Math.abs(velocity) > 0.01) {
                const steerSpeed = 0.03 * (velocity > 0 ? 1 : -1);
                if (keys['a']) rotation += steerSpeed;
                if (keys['d']) rotation -= steerSpeed;
            }

            // Update Car Position/Rotation
            carGroup.rotation.y = rotation;
            carGroup.position.x += Math.sin(rotation) * velocity;
            carGroup.position.z += Math.cos(rotation) * velocity;

            // --- CAMERA FOLLOW (Third Person) ---
            const relativeCameraOffset = new THREE.Vector3(0, 5, -10); // Position behind car
            const cameraOffset = relativeCameraOffset.applyMatrix4(carGroup.matrixWorld);
            
            camera.position.x = carGroup.position.x + cameraOffset.x;
            camera.position.y = carGroup.position.y + cameraOffset.y;
            camera.position.z = carGroup.position.z + cameraOffset.z;
            camera.lookAt(carGroup.position);

            renderer.render(scene, camera);
        }

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
